<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatGo – Private Chat</title>

<style>
body{margin:0;font-family:Arial;background:#0b141a;color:#e9edef}
header{background:#075e54;color:#fff;padding:10px;text-align:center}
#top{padding:10px;background:#111b21}
input,button{
  width:100%;padding:12px;margin:6px 0;
  border-radius:25px;border:none;font-size:14px
}
input{background:#0b141a;color:#fff;border:1px solid #2a3942}
button{background:#25d366;font-weight:bold}
#chat{height:60vh;overflow:auto;padding:10px}
.row{display:flex;margin:6px 0}
.left{justify-content:flex-start}
.right{justify-content:flex-end}
.bubble{
  max-width:75%;padding:10px;border-radius:10px;
  background:#202c33;font-size:14px
}
.right .bubble{background:#005c4b}
</style>
</head>

<body>

<header>
<b>ChatGo</b><br>
Bright Career Public School
</header>

<div id="top">
<input id="room" placeholder="Enter Private Room Code">
<button onclick="joinRoom()">Join / Change Room</button>
</div>

<div id="chat"></div>

<input id="msg" placeholder="Type message">
<button onclick="sendMsg()">Send</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getDatabase, ref, push, onChildAdded }
from "https://www.gstatic.com/firebasejs/12.7.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAT0l83gGJipO3aQHpSypkQKeMWy5PwxRU",
  authDomain: "chat-b6a52.firebaseapp.com",
  databaseURL: "https://chat-b6a52-default-rtdb.firebaseio.com",
  projectId: "chat-b6a52"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const chat = document.getElementById("chat");
const msg = document.getElementById("msg");
const roomInput = document.getElementById("room");

// 🔑 Auto random username
const user = "User" + Math.floor(Math.random()*10000);

let roomRef = null;

window.joinRoom = () => {
  if(!roomInput.value.trim()){
    alert("Room code likho");
    return;
  }
  chat.innerHTML = "";
  roomRef = ref(db, "privateRooms/" + roomInput.value.trim());

  onChildAdded(roomRef, snap => {
    const d = snap.val();

    // 🔔 Notification
    if(d.user !== user){
      new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg").play();
      document.title = "New Message!";
    }

    const row = document.createElement("div");
    row.className = "row " + (d.user === user ? "right" : "left");
    row.innerHTML = `<div class="bubble"><b>${d.user}</b><br>${d.text}</div>`;
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
  });
};

window.sendMsg = () => {
  if(!roomRef || !msg.value) return;
  push(roomRef,{
    user:user,
    text:msg.value,
    time:Date.now()
  });
  msg.value="";
};
</script>

</body>
</html>
