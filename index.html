<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatGo – Private Chat</title>

<style>
body{margin:0;font-family:Arial;background:#0b141a;color:#e9edef}
header{background:#075e54;color:#fff;padding:10px}
header b{font-size:16px}
#status{font-size:12px;opacity:.9}

#top{padding:10px;background:#111b21}
input,button{
  width:100%;padding:12px;margin:6px 0;
  border-radius:25px;border:none;font-size:14px
}
input{background:#0b141a;color:#fff;border:1px solid #2a3942}
button{background:#25d366;font-weight:bold}

#typing{font-size:12px;opacity:.8;margin:4px 10px}
#chat{height:55vh;overflow:auto;padding:10px}

.row{display:flex;margin:6px 0}
.left{justify-content:flex-start}
.right{justify-content:flex-end}
.bubble{
  max-width:75%;padding:10px;border-radius:10px;
  background:#202c33;font-size:14px
}
.right .bubble{background:#005c4b}
</style>
</head>

<body>

<header>
<b>ChatGo</b><br>
<span id="status">offline</span>
</header>

<div id="top">
<input id="room" placeholder="Enter Private Room Code">
<button onclick="joinRoom()">Join / Change Room</button>
</div>

<div id="typing"></div>
<div id="chat"></div>

<input id="msg" placeholder="Type message">
<button onclick="sendMsg()">Send</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getDatabase, ref, push, onChildAdded,
  set, onValue, onDisconnect
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAT0l83gGJipO3aQHpSypkQKeMWy5PwxRU",
  authDomain: "chat-b6a52.firebaseapp.com",
  databaseURL: "https://chat-b6a52-default-rtdb.firebaseio.com",
  projectId: "chat-b6a52"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const chat = document.getElementById("chat");
const msg = document.getElementById("msg");
const roomInput = document.getElementById("room");
const typingBox = document.getElementById("typing");
const statusText = document.getElementById("status");

// 🔑 Auto random user
const user = "User" + Math.floor(Math.random()*10000);

let roomRef, usersRef, typingRef;

// join room
window.joinRoom = () => {
  if(!roomInput.value.trim()){
    alert("Room code likho");
    return;
  }

  chat.innerHTML="";
  typingBox.innerText="";
  statusText.innerText="offline";

  const room = roomInput.value.trim();

  roomRef   = ref(db,"rooms/"+room+"/messages");
  usersRef  = ref(db,"rooms/"+room+"/users/"+user);
  typingRef = ref(db,"rooms/"+room+"/typing/"+user);

  // online
  set(usersRef,{state:"online",time:Date.now()});
  onDisconnect(usersRef).set({state:"offline",time:Date.now()});

  // online / last seen
  onValue(ref(db,"rooms/"+room+"/users"), snap=>{
    let online=false,last="";
    snap.forEach(c=>{
      if(c.key!==user){
        if(c.val().state==="online") online=true;
        else last="last seen "+new Date(c.val().time).toLocaleString();
      }
    });
    statusText.innerText = online ? "online" : last || "offline";
  });

  // typing
  onValue(ref(db,"rooms/"+room+"/typing"), snap=>{
    let t=[];
    snap.forEach(c=>{
      if(c.key!==user && c.val()==="typing") t.push(c.key);
    });
    typingBox.innerText = t.length ? t.join(", ")+" typing..." : "";
  });

  // messages
  onChildAdded(roomRef,snap=>{
    const d=snap.val();

    if(d.user!==user){
      new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg").play();
      document.title="New Message!";
    }

    const row=document.createElement("div");
    row.className="row "+(d.user===user?"right":"left");
    row.innerHTML=`<div class="bubble"><b>${d.user}</b><br>${d.text}</div>`;
    chat.appendChild(row);
    chat.scrollTop=chat.scrollHeight;
  });
};

// typing detect
let timer;
msg.addEventListener("input",()=>{
  if(!typingRef) return;
  set(typingRef,"typing");
  clearTimeout(timer);
  timer=setTimeout(()=>set(typingRef,""),1200);
});

// send msg
window.sendMsg = () => {
  if(!roomRef || !msg.value) return;
  push(roomRef,{
    user:user,
    text:msg.value,
    time:Date.now()
  });
  msg.value="";
  set(typingRef,"");
};
</script>

</body>
</html>
