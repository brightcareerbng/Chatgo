<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatGo – Bright Career Public School</title>

<style>
body{margin:0;font-family:Arial;background:#0b141a;color:#e9edef}
header{background:#075e54;color:#fff;padding:10px;display:flex;gap:10px;align-items:center}
header img{width:42px;height:42px;border-radius:50%;background:#fff}
header .title{font-size:14px;font-weight:bold}
header .school{font-size:12px}
header .status{font-size:11px;opacity:.9}

input{width:100%;padding:12px;margin-bottom:8px;border-radius:25px;border:1px solid #2a3942;background:#0b141a;color:#fff}
button{padding:12px;border:none;border-radius:25px;background:#25d366;font-weight:bold}

#login,#chatBox{padding:15px}
#chat{height:52vh;overflow:auto;padding:10px}
.row{display:flex;margin:6px 0}
.left{justify-content:flex-start}
.right{justify-content:flex-end}
.bubble{max-width:75%;padding:10px;border-radius:10px;background:#202c33}
.right .bubble{background:#005c4b}
footer{display:flex;gap:8px;padding:10px;background:#111b21}
footer input{flex:1}
#typing{font-size:12px;opacity:.8;margin:4px 10px}
</style>
</head>

<body>

<header>
<img src="https://ik.imagekit.io/a2wpi1kd9/imgToUrl/image-to-url_9FkUjGvCmc">
<div class="title">
ChatGo
<div class="school">Bright Career Public School</div>
<div class="status" id="statusText">offline</div>
</div>
</header>

<!-- LOGIN -->
<div id="login">
<input id="phone" placeholder="+91XXXXXXXXXX">
<div id="recaptcha"></div>
<button onclick="sendOTP()">Send OTP</button>
<input id="otp" placeholder="Enter OTP">
<button onclick="verifyOTP()">Verify & Login</button>
</div>

<!-- CHAT -->
<div id="chatBox" style="display:none">
<input id="room" placeholder="Private Room ID">
<div id="typing"></div>
<div id="chat"></div>
<footer>
<input id="msg" placeholder="Type message">
<button onclick="sendMsg()">Send</button>
</footer>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getAuth, RecaptchaVerifier, signInWithPhoneNumber } from
"https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
import { getDatabase, ref, push, onChildAdded, set, onValue, onDisconnect }
from "https://www.gstatic.com/firebasejs/12.7.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAT0l83gGJipO3aQHpSypkQKeMWy5PwxRU",
  authDomain: "chat-b6a52.firebaseapp.com",
  databaseURL: "https://chat-b6a52-default-rtdb.firebaseio.com",
  projectId: "chat-b6a52",
  messagingSenderId: "108909929088",
  appId: "1:108909929088:web:fd976f913738e8d9a8fc65"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

let userPhone="", roomRef, statusRef, typingRef;
const chat=document.getElementById("chat");
const typingBox=document.getElementById("typing");
const statusText=document.getElementById("statusText");

window.recaptchaVerifier = new RecaptchaVerifier(auth,"recaptcha",{size:"normal"});
let confirmation;

window.sendOTP = ()=>{
  signInWithPhoneNumber(auth, phone.value, window.recaptchaVerifier)
  .then(r=>{confirmation=r; alert("OTP sent");})
  .catch(e=>alert(e.message));
};

window.verifyOTP = ()=>{
  confirmation.confirm(otp.value).then(res=>{
    userPhone=res.user.phoneNumber;
    document.getElementById("login").style.display="none";
    document.getElementById("chatBox").style.display="block";
  });
};

room.addEventListener("change",()=>{
  chat.innerHTML="";
  const r=room.value.trim();
  roomRef=ref(db,"rooms/"+r+"/messages");
  statusRef=ref(db,"rooms/"+r+"/users/"+userPhone);
  typingRef=ref(db,"rooms/"+r+"/typing/"+userPhone);

  set(statusRef,{state:"online",time:Date.now()});
  onDisconnect(statusRef).set({state:"offline",time:Date.now()});

  onValue(ref(db,"rooms/"+r+"/users"),s=>{
    let online=false,last="";
    s.forEach(c=>{
      if(c.key!==userPhone){
        if(c.val().state==="online") online=true;
        else last="last seen "+new Date(c.val().time).toLocaleString();
      }
    });
    statusText.innerText=online?"online":last||"offline";
  });

  onValue(ref(db,"rooms/"+r+"/typing"),s=>{
    let t=[];
    s.forEach(c=>{if(c.key!==userPhone&&c.val()==="typing")t.push(c.key)});
    typingBox.innerText=t.length?t.join(", ")+" typing...":"";
  });

  onChildAdded(roomRef,s=>{
    const d=s.val();
    const row=document.createElement("div");
    row.className="row "+(d.user===userPhone?"right":"left");
    row.innerHTML=`<div class="bubble">${d.user}<br>${d.text}</div>`;
    chat.appendChild(row);
    chat.scrollTop=chat.scrollHeight;
  });
});

let timer;
msg.addEventListener("input",()=>{
  set(typingRef,"typing");
  clearTimeout(timer);
  timer=setTimeout(()=>set(typingRef,""),1200);
});

window.sendMsg=()=>{
  push(roomRef,{user:userPhone,text:msg.value,time:Date.now()});
  msg.value="";
  set(typingRef,"");
};
</script>

</body>
</html>
